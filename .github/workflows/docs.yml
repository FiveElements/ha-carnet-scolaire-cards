name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements_docs.txt
      - run: mkdocs build --strict
      # Couverture des tests, publiée avec la documentation sous la forme
      # qu'attend un badge img.shields.io « endpoint » : aucun service tiers,
      # aucun jeton. Le chiffre est celui des lignes de `src/` couvertes par
      # `npm test`, mesuré sur le commit qui publie la page.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.include='src/**'
      - run: |
          node -e "
            const pct = require('./coverage/coverage-summary.json').total.lines.pct;
            const color = pct >= 90 ? 'brightgreen' : pct >= 75 ? 'yellow' : 'red';
            const badge = { schemaVersion: 1, label: 'couverture', message: pct.toFixed(1) + ' %', color };
            require('fs').writeFileSync('site/coverage.json', JSON.stringify(badge));
          "
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
