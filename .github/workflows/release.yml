name: Publication

on:
  push:
    tags: ['v*']

# Lecture seule par défaut ; l'écriture n'est accordée qu'au job qui crée la
# publication, et seulement sur le contenu (OpenSSF Scorecard, Token-Permissions).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vérifier que le bundle n'est pas vide et contient les cartes
        run: |
          test -s dist/carnet-scolaire-cards.js
          grep -q 'carnet-scolaire-prochain-cours' dist/carnet-scolaire-cards.js
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/carnet-scolaire-cards.js
          generate_release_notes: true
