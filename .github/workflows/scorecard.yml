name: OpenSSF Scorecard

# Évaluation des pratiques de sécurité du dépôt (protection de branche,
# épinglage des actions, permissions des workflows, vulnérabilités connues…)
# par l'OpenSSF. Aucun compte tiers, aucun secret : le résultat est signé par
# le jeton OIDC du workflow et publié sur api.scorecard.dev, d'où le badge du
# README le lit.
#
# Ce que le badge dit : une note sur dix, agrégée sur des vérifications
# automatiques. Ce qu'il ne dit pas : que le code est sûr. C'est une mesure des
# pratiques, pas un audit.
#
# `publish_results: true` impose des contraintes au workflow lui-même : pas de
# `env` ni de `defaults` globaux, et uniquement des actions reconnues dans le
# job d'analyse. Ne l'enrichissez pas d'autres étapes.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Analyse Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
